name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test Go packages
        run: go test ./...

      - name: Vet Go packages
        run: go vet ./...

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: internal/admin/ui/package-lock.json

      - name: Install admin UI dependencies
        working-directory: internal/admin/ui
        run: npm ci

      - name: Audit admin UI dependencies
        working-directory: internal/admin/ui
        run: npm audit --audit-level=high

      - name: Build admin UI
        working-directory: internal/admin/ui
        run: npm run build

      - name: Check embedded UI assets are current
        run: git diff --exit-code -- internal/admin/ui/dist

  build:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: internal/admin/ui/package-lock.json

      - name: Build admin UI
        working-directory: internal/admin/ui
        run: |
          npm ci
          npm run build

      - name: Build binaries
        run: |
          mkdir -p build
          suffix=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            suffix=".exe"
          fi
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build -o "build/mitm-proxy-${{ matrix.goos }}-${{ matrix.goarch }}${suffix}" .

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*
